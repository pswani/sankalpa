spring:
  application:
    name: sankalpa-backend
  datasource:
    url: ${SANKALPA_DB_URL:jdbc:sqlite:./data/sankalpa.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA foreign_keys=ON
  sql:
    init:
      mode: always
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
server:
  port: ${PORT:8080}
sankalpa:
  timezone: ${SANKALPA_TIMEZONE}
